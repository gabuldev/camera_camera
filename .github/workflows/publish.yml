name: Publish to pub.dev

on:
  push:
    tags:
      # Precisa casar com o padrao configurado no pub.dev (Automated publishing).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: 'Publish to pub.dev'
    permissions:
      # Necessario para o OIDC: o pub.dev troca esse JWT pela credencial.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uma tag pode ser empurrada a mao, de um commit que nunca passou por PR.
      # Revalidar aqui e barato e evita publicar algo quebrado, o que nao tem volta.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Publish - dry run
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        run: flutter pub publish --force
