name: Release

on:
  push:
    branches:
      - main

# Nunca dois releases simultaneos, e nunca cancelar um no meio: publicar
# no pub.dev e irreversivel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Missing RELEASE_TOKEN secret. The tag must be pushed with its own token, because a tag pushed with GITHUB_TOKEN does not trigger publish.yml."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail

          current=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          last_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)

          # Guarda: se a versao do pubspec ainda nao foi publicada, o bump
          # automatico pularia ela silenciosamente. Publique-a antes.
          if [ -n "$current" ] && ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            echo "::error::pubspec.yaml is at $current but tag v$current does not exist. Publish that version before enabling automated releases, otherwise it would be skipped."
            exit 1
          fi

          if [ -z "$last_tag" ]; then
            range=""
          else
            range="$last_tag..HEAD"
          fi

          git log --no-merges --format='%s' $range > subjects.txt
          git log --no-merges --format='%B' $range > bodies.txt

          bump=none
          if grep -qE '^BREAKING[ -]CHANGE:' bodies.txt \
            || grep -qE '^[a-z]+(\([^)]*\))?!:' subjects.txt; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' subjects.txt; then
            bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' subjects.txt; then
            bump=patch
          fi

          echo "Current version: $current | last tag: ${last_tag:-none} | bump: $bump"

          if [ "$bump" = none ]; then
            echo "No feat/fix/perf commit since the last release; nothing to publish."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${current%%[-+]*}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"

          grep -E '^(feat|fix|perf)(\([^)]*\))?!?:' subjects.txt | sed 's/^/- /' > notes.txt

          {
            echo "bump=$bump"
            echo "version=$next"
          } >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Bump pubspec and CHANGELOG
        if: steps.next.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version:.*/s//version: $VERSION/" pubspec.yaml
          {
            echo "# $VERSION"
            echo
            cat notes.txt
            echo
          } > entry.md
          cat entry.md CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          rm -f entry.md notes.txt subjects.txt bodies.txt

      - name: Commit and tag
        if: steps.next.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore: release $VERSION [skip ci]"
          git tag "v$VERSION"

          # O commit vai com o GITHUB_TOKEN, que nao re-dispara workflows.
          git push origin HEAD:main

          # A tag vai com o RELEASE_TOKEN, justamente para disparar publish.yml.
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"
          echo "Pushed v$VERSION; publish.yml takes over from here."
